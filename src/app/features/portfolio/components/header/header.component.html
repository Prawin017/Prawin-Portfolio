<header class="header-nav" [class.header-scrolled]="isScrolled()">
  <div class="container py-3 d-flex align-items-center justify-content-between">
    <!-- Logo -->
    <a href="#" class="logo-text" appMagnetic [magneticStrength]="0.15" (click)="scrollToSection('about', $event)">
      Prawin's Portfolio<span class="dot">.</span>
    </a>

    <!-- Desktop Navigation Links & Action Widgets -->
    <div class="d-none d-md-flex align-items-center gap-4">
      <nav class="d-flex align-items-center gap-4">
        <a href="#about" class="nav-link-item" appMagnetic [magneticStrength]="0.2"
          (click)="scrollToSection('about', $event)">About</a>
        <a href="#skills" class="nav-link-item" appMagnetic [magneticStrength]="0.2"
          (click)="scrollToSection('skills', $event)">Skills</a>
        <a href="#work" class="nav-link-item" appMagnetic [magneticStrength]="0.2"
          (click)="scrollToSection('work', $event)">Work</a>
        <a href="#contact" class="nav-link-item" appMagnetic [magneticStrength]="0.2"
          (click)="scrollToSection('contact', $event)">Contact</a>
      </nav>
      <!-- Vertical Divider -->
      <div class="nav-divider"></div>

      <!-- LinkedIn Icon Link -->
      @if (contactInfo().linkedin) {
      <a [href]="contactInfo().linkedin" target="_blank" rel="noopener noreferrer" class="nav-linkedin-link" appMagnetic
        [magneticStrength]="0.2" title="Connect on LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
      }

      <!-- Resume Action Button -->
      <a href="#contact" class="btn-resume" appMagnetic [magneticStrength]="0.25"
        (click)="scrollToSection('contact', $event)">Hire me</a>

      <!-- Deluxe Celestial Theme Toggle Button -->
      <button class="theme-toggle-btn celestial-btn" (click)="toggleTheme()" 
        [attr.aria-label]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'" 
        appMagnetic [magneticStrength]="0.2">
        <span class="celestial-inner" [class.is-sun]="isDarkMode()" [class.is-moon]="!isDarkMode()">
          @if (isDarkMode()) {
          <!-- Radiant Amber Sun -->
          <span class="celestial-icon sun-icon" aria-hidden="true">
            <i class="bi bi-sun-fill"></i>
          </span>
          } @else {
          <!-- Sleek Cyan Crescent Moon & Stars -->
          <span class="celestial-icon moon-icon" aria-hidden="true">
            <i class="bi bi-moon-stars-fill"></i>
          </span>
          }
        </span>
      </button>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button class="mobile-toggle-btn d-md-none" [class.open]="isMobileMenuOpen()" (click)="toggleMobileMenu()"
      aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (isMobileMenuOpen()) {
  <div class="mobile-drawer d-md-none animate-fade-in-up">
    <nav class="d-flex flex-column align-items-center gap-4 py-5">
      <a href="#about" class="nav-link-mobile" (click)="scrollToSection('about', $event)">About</a>
      <a href="#skills" class="nav-link-mobile" (click)="scrollToSection('skills', $event)">Skills</a>
      <a href="#work" class="nav-link-mobile" (click)="scrollToSection('work', $event)">Work</a>
      <a href="#contact" class="nav-link-mobile" (click)="scrollToSection('contact', $event)">Contact</a>
      <!-- Mobile LinkedIn Link -->
      @if (contactInfo().linkedin) {
      <a [href]="contactInfo().linkedin" target="_blank" rel="noopener noreferrer" class="nav-linkedin-mobile-link"
        (click)="closeMobileMenu()">
        <i class="bi bi-linkedin"></i> Connect on LinkedIn
      </a>
      }

      <div class="d-flex flex-column align-items-center gap-3 w-75 mt-3">
        <a href="#contact" class="btn-resume w-100 text-center" (click)="scrollToSection('contact', $event)">Hire me</a>
        <button class="theme-toggle-mobile-btn w-100" (click)="toggleTheme()">
          <span class="celestial-mobile-inner" [class.is-sun]="isDarkMode()" [class.is-moon]="!isDarkMode()">
            @if (isDarkMode()) {
            <span class="celestial-icon sun-icon me-2" aria-hidden="true">
              <i class="bi bi-sun-fill"></i>
            </span>
            <span>Switch to Light Mode</span>
            } @else {
            <span class="celestial-icon moon-icon me-2" aria-hidden="true">
              <i class="bi bi-moon-stars-fill"></i>
            </span>
            <span>Switch to Dark Mode</span>
            }
          </span>
        </button>
      </div>
    </nav>
  </div>
  }

  <!-- Reading Progress Bar -->
  <div class="scroll-progress-container">
    <div class="scroll-progress-bar" [style.width.%]="scrollProgress()"></div>
  </div>
</header>
